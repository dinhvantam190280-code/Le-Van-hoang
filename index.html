<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>304GAMER | CYBER SYSTEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- CÀI ĐẶT CHUNG --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* --- NỀN VIDEO CYBERPUNK CHUYỂN ĐỘNG --- */
    .video-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -2;
      object-fit: cover;
      opacity: 0.3;
    }
    .overlay-gradient {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 0%, #000 100%);
      z-index: -1;
    }

    /* --- HIỆU ỨNG GLITCH CHỮ --- */
    .glitch {
      font-family: 'Orbitron', sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      position: relative;
      display: inline-block;
      letter-spacing: 5px;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }
    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 #ff00c1;
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim 5s infinite linear alternate-reverse;
    }
    .glitch::after {
      left: -2px;
      text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
      animation: glitch-anim2 1s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(10px, 9999px, 83px, 0); }
      20% { clip: rect(62px, 9999px, 14px, 0); }
      40% { clip: rect(33px, 9999px, 97px, 0); }
      60% { clip: rect(89px, 9999px, 53px, 0); }
      80% { clip: rect(46px, 9999px, 72px, 0); }
      100% { clip: rect(22px, 9999px, 90px, 0); }
    }
    @keyframes glitch-anim2 {
      0% { clip: rect(65px, 9999px, 100px, 0); }
      20% { clip: rect(12px, 9999px, 34px, 0); }
      40% { clip: rect(78px, 9999px, 12px, 0); }
      60% { clip: rect(34px, 9999px, 89px, 0); }
      80% { clip: rect(90px, 9999px, 43px, 0); }
      100% { clip: rect(55px, 9999px, 67px, 0); }
    }

    /* --- HEADER --- */
    .header {
      margin-top: 70px;
      text-align: center;
      z-index: 10;
    }
    .subtitle {
      color: #00fff9;
      font-size: 14px;
      letter-spacing: 6px;
      margin-top: 10px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 10px #00fff9;
    }

    /* --- DANH SÁCH GAME (THẺ 3D) --- */
    .game-container {
      width: 90%;
      max-width: 450px;
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      z-index: 10;
    }

    .game-card {
      position: relative;
      height: 120px;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transform-style: preserve-3d;
      transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
      transition: 0.1s;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    /* Ảnh nền cho từng game */
    .bg-ff { background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop') center/cover; }
    .bg-lq { background: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=800&auto=format&fit=crop') center/cover; }
    .bg-pubg { background: url('https://images.unsplash.com/photo-1589241062272-c0a0e9d0cb45?q=80&w=800&auto=format&fit=crop') center/cover; }

    /* Lớp phủ mờ đen */
    .game-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
    }

    .game-icon {
      font-size: 40px;
      margin-right: 20px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
    }

    .game-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .game-sub {
      font-size: 12px;
      color: #00fff9;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Hiệu ứng Hover lướt qua */
    .game-card:hover {
      border-color: #00fff9;
      box-shadow: 0 0 20px rgba(0, 255, 249, 0.4);
    }

    /* --- NÚT TELEGRAM NEON --- */
    .telegram-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 90%;
      max-width: 450px;
      margin-top: 40px;
      margin-bottom: 50px;
      padding: 18px;
      background: transparent;
      color: #00fff9;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      border-radius: 50px;
      border: 2px solid #00fff9;
      box-shadow: 0 0 15px #00fff9, inset 0 0 15px #00fff9;
      text-shadow: 0 0 10px #00fff9;
      transition: 0.3s;
      z-index: 10;
    }

    .telegram-btn:hover {
      background: #00fff9;
      color: #000;
      box-shadow: 0 0 30px #00fff9, inset 0 0 30px #00fff9;
      text-shadow: none;
    }

    /* --- POPUP BẢNG MOD (GLITCH) --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal.show { display: flex; opacity: 1; }

    .modal-box {
      width: 90%;
      max-width: 400px;
      background: #050505;
      border: 1px solid #00fff9;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 255, 249, 0.2);
      transform: scale(0.95);
      transition: 0.3s;
    }
    .modal.show .modal-box { transform: scale(1); }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      color: #00fff9;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,255,249,0.3);
      padding-bottom: 15px;
      text-shadow: 0 0 10px #00fff9;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #ff00c1;
      font-size: 24px;
      cursor: pointer;
      text-shadow: 0 0 10px #ff00c1;
    }

    /* Nút Tải */
    .dl-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 5px;
    }

    .btn-dl {
      display: block;
      padding: 16px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: 0.3s;
      font-family: 'Chakra Petch', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-ff { background: rgba(255, 153, 0, 0.1); color: #ff9900; border-color: #ff9900; box-shadow: inset 0 0 10px rgba(255,153,0,0.2); }
    .btn-ff:hover { background: #ff9900; color: #000; box-shadow: 0 0 20px #ff9900; }

    .btn-lq { background: rgba(0, 210, 255, 0.1); color: #00d2ff; border-color: #00d2ff; box-shadow: inset 0 0 10px rgba(0,210,255,0.2); }
    .btn-lq:hover { background: #00d2ff; color: #000; box-shadow: 0 0 20px #00d2ff; }

    .btn-pubg { background: rgba(255, 215, 0, 0.1); color: #ffd700; border-color: #ffd700; box-shadow: inset 0 0 10px rgba(255,215,0,0.2); }
    .btn-pubg:hover { background: #ffd700; color: #000; box-shadow: 0 0 20px #ffd700; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #00fff9; border-radius: 10px; }

  </style>
</head>

  <script>
    // XỬ LÝ NHẠC
    var audio = document.getElementById("bg-music");
    document.body.addEventListener('click', function() {
      if(audio.paused) { audio.play(); }
    }, { once: true });

    // ĐÓNG MỞ POPUP
    function openModal(id) {
      document.getElementById(id).classList.add('show');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.classList.remove('show');
      }
    }

    // HIỆU ỨNG 3D NGHIÊNG THẺ GAME KHI CHẠM
    const cards = document.querySelectorAll('.game-card');
    cards.forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
      });
    });
  </script>
